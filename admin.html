<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnyWork365 Admin</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f6f9fc;
        color: #18212f;
        padding: 2rem;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 1rem;
      }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 1.25rem;
        box-shadow: 0 12px 24px rgba(18, 61, 138, 0.06);
      }
      .login-box {
        max-width: 420px;
        margin: 3rem auto;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        box-shadow: 0 12px 24px rgba(18, 61, 138, 0.06);
        padding: 2rem;
      }
      .login-box h2 {
        margin-top: 0;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .field label {
        font-weight: 700;
        color: #2d3e5f;
      }
      input, select, button {
        padding: 0.72rem 0.8rem;
        border-radius: 10px;
        border: 1px solid #dfeaff;
        font: inherit;
      }
      input {
        background: #f7fbff;
      }
      button {
        background: #123d8a;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th, td {
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
        padding: 0.85rem 0.6rem;
        vertical-align: top;
      }
      th {
        font-size: 0.9rem;
        color: #59657a;
      }
      .status {
        display: inline-block;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: capitalize;
        min-width: 88px;
        text-align: center;
      }
      .pending, .new { background: #fff7e6; color: #a85d00; }
      .approved, .contacted { background: #eaf7ee; color: #0f8a52; }
      .rejected, .closed { background: #ffeaea; color: #c92c2c; }
      .admin-summary {
        margin-bottom: 1rem;
        font-size: 1rem;
        color: #59657a;
      }
      .empty {
        padding: 1rem 0;
        color: #59657a;
      }
      select {
        min-width: 120px;
        border: 1px solid #cfe0ff;
        background: white;
        color: #18212f;
        font-weight: 600;
      }
      .error {
        color: #b42318;
        margin-top: 0.75rem;
        min-height: 1.25rem;
      }
      .tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .tab-btn {
        background: white;
        color: #123d8a;
        border: 1px solid #cfe0ff;
        font-weight: 700;
      }
      .tab-btn.active {
        background: #123d8a;
        color: white;
      }
      .delete-btn {
        background: #ffeaea;
        color: #c92c2c;
        border: 1px solid #ffd0d0;
        font-weight: 700;
        padding: 0.4rem 0.7rem;
        margin-left: 0.4rem;
      }
    </style>
  </head>
  <body>
    <div id="loginView" class="login-box">
      <h2>AnyWork365 Admin Login</h2>
      <div class="field">
        <label for="adminUsername">Username</label>
        <input id="adminUsername" type="text" placeholder="Enter username" value="anyworkadmin" />
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password" placeholder="Enter password" value="AnyWork@2026!" />
      </div>
      <button id="loginButton" type="button">Login</button>
      <div id="loginError" class="error"></div>
    </div>

    <div id="adminView" class="container" style="display:none;">
      <h1>AnyWork365 Admin Dashboard</h1>
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabContacts">Contact Requests</button>
        <button type="button" class="tab-btn" id="tabWorkers">Helper Applications</button>
      </div>

      <div id="contactsPanel" class="card">
        <div id="contactsSummary" class="admin-summary">Loading requests...</div>
        <div id="contactList">Loading requests...</div>
      </div>

      <div id="workersPanel" class="card" style="display:none;">
        <div id="adminSummary" class="admin-summary">Loading applicants...</div>
        <div id="workerList">Loading applicants...</div>
      </div>
    </div>

    <script>
      const API_BASE_URL = window.ANYWORK_API_URL || window.location.origin;
      const loginView = document.getElementById('loginView');
      const adminView = document.getElementById('adminView');
      const loginError = document.getElementById('loginError');
      const workerList = document.getElementById('workerList');
      const adminSummary = document.getElementById('adminSummary');
      const contactList = document.getElementById('contactList');
      const contactsSummary = document.getElementById('contactsSummary');
      const usernameInput = document.getElementById('adminUsername');
      const passwordInput = document.getElementById('adminPassword');
      const loginButton = document.getElementById('loginButton');
      const tabContacts = document.getElementById('tabContacts');
      const tabWorkers = document.getElementById('tabWorkers');
      const contactsPanel = document.getElementById('contactsPanel');
      const workersPanel = document.getElementById('workersPanel');
      let adminUser = sessionStorage.getItem('anywork_admin_user') || 'anyworkadmin';
      let adminPass = sessionStorage.getItem('anywork_admin_pass') || 'AnyWork@2026!';

      function getAuthHeader(user, pass) {
        return 'Basic ' + btoa(`${user}:${pass}`);
      }

      function showTab(tab) {
        const isContacts = tab === 'contacts';
        tabContacts.classList.toggle('active', isContacts);
        tabWorkers.classList.toggle('active', !isContacts);
        contactsPanel.style.display = isContacts ? 'block' : 'none';
        workersPanel.style.display = isContacts ? 'none' : 'block';
      }

      tabContacts.addEventListener('click', () => showTab('contacts'));
      tabWorkers.addEventListener('click', () => showTab('workers'));

      async function fetchContacts() {
        try {
          const response = await fetch(`${API_BASE_URL}/api/contact/list?t=${Date.now()}`, {
            headers: {
              'Authorization': getAuthHeader(adminUser, adminPass)
            }
          });

          if (!response.ok) {
            throw new Error('Unauthorized');
          }

          const data = await response.json();
          const contacts = (data.contacts || []).slice().reverse();

          contactsSummary.textContent = `${contacts.length} total request${contacts.length === 1 ? '' : 's'}`;

          if (!contacts.length) {
            contactList.innerHTML = '<div class="empty">No contact requests yet.</div>';
            return;
          }

          contactList.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Service</th>
                  <th>Details</th>
                  <th>Received</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${contacts.map(contact => `
                  <tr>
                    <td>${contact.name}</td>
                    <td>${contact.email}</td>
                    <td>${contact.service}</td>
                    <td>${contact.details}</td>
                    <td>${new Date(contact.createdAt).toLocaleString()}</td>
                    <td>
                      <span class="status ${contact.status || 'new'}">${contact.status || 'new'}</span>
                    </td>
                    <td>
                      <select data-contact-id="${contact.id}">
                        <option value="new" ${contact.status === 'new' ? 'selected' : ''}>New</option>
                        <option value="contacted" ${contact.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                        <option value="closed" ${contact.status === 'closed' ? 'selected' : ''}>Closed</option>
                      </select>
                      <button type="button" class="delete-btn" data-delete-contact-id="${contact.id}">Delete</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;

          document.querySelectorAll('select[data-contact-id]').forEach((select) => {
            select.addEventListener('change', async (event) => {
              const id = event.target.getAttribute('data-contact-id');
              const status = event.target.value;

              const updateResponse = await fetch(`${API_BASE_URL}/api/contact/${id}/status`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': getAuthHeader(adminUser, adminPass)
                },
                body: JSON.stringify({ status })
              });

              const result = await updateResponse.json();
              alert(result.message || 'Status updated');
              fetchContacts();
            });
          });

          document.querySelectorAll('button[data-delete-contact-id]').forEach((button) => {
            button.addEventListener('click', async (event) => {
              const id = event.target.getAttribute('data-delete-contact-id');
              if (!confirm('Delete this contact request?')) return;

              const deleteResponse = await fetch(`${API_BASE_URL}/api/contact/${id}`, {
                method: 'DELETE',
                headers: {
                  'Authorization': getAuthHeader(adminUser, adminPass)
                }
              });

              const result = await deleteResponse.json();
              alert(result.message || 'Deleted');
              fetchContacts();
            });
          });
        } catch (error) {
          loginView.style.display = 'block';
          adminView.style.display = 'none';
          loginError.textContent = 'Invalid username or password.';
        }
      }

      async function fetchWorkers() {
        try {
          const response = await fetch(`${API_BASE_URL}/api/career/workers?t=${Date.now()}`, {
            headers: {
              'Authorization': getAuthHeader(adminUser, adminPass)
            }
          });

          if (!response.ok) {
            throw new Error('Unauthorized');
          }

          const data = await response.json();
          const workers = data.workers || [];

          adminSummary.textContent = `${workers.length} total applicant${workers.length === 1 ? '' : 's'}`;

          if (!workers.length) {
            workerList.innerHTML = '<div class="empty">No helper registrations yet.</div>';
            return;
          }

          workerList.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Registering from</th>
                  <th>Service</th>
                  <th>Notes</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${workers.map(worker => `
                  <tr>
                    <td>${worker.name}</td>
                    <td>${worker.email}</td>
                    <td>${worker.phone}</td>
                    <td>${worker.registeringFrom || 'Not specified'}</td>
                    <td>${worker.service}</td>
                    <td>${worker.details}</td>
                    <td>
                      <span class="status ${worker.status || 'pending'}">${worker.status || 'pending'}</span>
                    </td>
                    <td>
                      <select data-id="${worker.id}">
                        <option value="pending" ${worker.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="approved" ${worker.status === 'approved' ? 'selected' : ''}>Approved</option>
                        <option value="rejected" ${worker.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                      </select>
                      <button type="button" class="delete-btn" data-delete-worker-id="${worker.id}">Delete</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;

          document.querySelectorAll('select[data-id]').forEach((select) => {
            select.addEventListener('change', async (event) => {
              const id = event.target.getAttribute('data-id');
              const status = event.target.value;

              const updateResponse = await fetch(`${API_BASE_URL}/api/career/${id}/status`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': getAuthHeader(adminUser, adminPass)
                },
                body: JSON.stringify({ status })
              });

              const result = await updateResponse.json();
              alert(result.message || 'Status updated');
              fetchWorkers();
            });
          });

          document.querySelectorAll('button[data-delete-worker-id]').forEach((button) => {
            button.addEventListener('click', async (event) => {
              const id = event.target.getAttribute('data-delete-worker-id');
              if (!confirm('Delete this helper application?')) return;

              const deleteResponse = await fetch(`${API_BASE_URL}/api/career/${id}`, {
                method: 'DELETE',
                headers: {
                  'Authorization': getAuthHeader(adminUser, adminPass)
                }
              });

              const result = await deleteResponse.json();
              alert(result.message || 'Deleted');
              fetchWorkers();
            });
          });
        } catch (error) {
          loginView.style.display = 'block';
          adminView.style.display = 'none';
          loginError.textContent = 'Invalid username or password.';
        }
      }

      function showAdminPanel() {
        loginView.style.display = 'none';
        adminView.style.display = 'block';
        showTab('contacts');
        fetchContacts();
        fetchWorkers();
        clearInterval(window.anyworkRefreshTimer);
        window.anyworkRefreshTimer = setInterval(() => {
          fetchContacts();
          fetchWorkers();
        }, 5000);
      }

      async function attemptLogin() {
        adminUser = usernameInput.value.trim();
        adminPass = passwordInput.value.trim();

        if (!adminUser || !adminPass) {
          loginError.textContent = 'Please enter both username and password.';
          return;
        }

        sessionStorage.setItem('anywork_admin_user', adminUser);
        sessionStorage.setItem('anywork_admin_pass', adminPass);

        const testResponse = await fetch(`${API_BASE_URL}/api/career/workers?t=${Date.now()}`, {
          headers: {
            'Authorization': getAuthHeader(adminUser, adminPass)
          }
        });

        if (testResponse.ok) {
          showAdminPanel();
        } else {
          loginError.textContent = 'Invalid username or password.';
        }
      }

      loginButton.addEventListener('click', attemptLogin);
      usernameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') attemptLogin();
      });
      passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') attemptLogin();
      });

      showAdminPanel();
    </script>
  </body>
</html>
