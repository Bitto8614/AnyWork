<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://anywork365.com/services" />
    <!-- Favicon-->
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="alternate" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon-180.png" />

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="Services | AnyWork365" />
    <meta property="og:description" content="Browse all AnyWork365 services including moving help, plumbing, electrical work, home cleaning, spa & massage, haircuts, car cleaning, home cooking, old age care, and more." />
    <meta property="og:image" content="https://anywork365.com/assets/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anywork365.com/services" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="/" class="brand"><img src="/assets/logo.svg" alt="AnyWork365 logo" class="brand-logo" /><span>AnyWork365</span></a>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/about">About</a>
          <a href="/services">Services</a>
          <a href="/careers">Careers</a>
          <a href="/contact">Contact</a>
        </nav>
        <div class="country-select-wrap">
          <select id="country-currency-select" aria-label="Select your country">
            <option value="USD">United States (USD)</option>
            <option value="INR">India (INR)</option>
          </select>
        </div>
        <a href="/#contact" class="btn btn-primary">Book a Helper</a>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="section-heading">
          <span class="eyebrow">Services</span>
          <h1>Everything you need when life needs a quick reset.</h1>
        </div>

        <div class="service-grid" id="services-catalog-grid">
          <p class="services-loading">Loading services...</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div class="brand footer-brand"><img src="assets/logo.svg" alt="AnyWork365 logo" class="brand-logo" /><span>AnyWork365</span></div>
        <p>Helping people move smarter and settle in faster.</p>
        <p>© <span id="year"></span> AnyWork365.</p>
      </div>
    </footer>
    <script src="/script.js"></script>
