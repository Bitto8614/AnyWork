<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services | AnyWork365</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="/" class="brand"><img src="/assets/logo.svg" alt="AnyWork365 logo" class="brand-logo" /><span>AnyWork365</span></a>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/about">About</a>
          <a href="/services">Services</a>
          <a href="/careers">Careers</a>
          <a href="/contact">Contact</a>
        </nav>
        <div class="country-select-wrap">
          <select id="country-currency-select" aria-label="Select your country">
            <option value="USD">United States (USD)</option>
            <option value="INR">India (INR)</option>
          </select>
        </div>
        <a href="/#contact" class="btn btn-primary">Book a Helper</a>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="section-heading">
          <span class="eyebrow">Services</span>
          <h2>Everything you need when life needs a quick reset.</h2>
        </div>

        <div class="service-grid" id="services-catalog-grid">
          <p class="services-loading">Loading services...</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div class="brand footer-brand"><img src="assets/logo.svg" alt="AnyWork365 logo" class="brand-logo" /><span>AnyWork365</span></div>
        <p>Helping people move smarter and settle in faster.</p>
        <p>© <span id="year"></span> AnyWork365.</p>
      </div>
    </footer>
    <script src="/script.js"></script>
  </body>
</html>
